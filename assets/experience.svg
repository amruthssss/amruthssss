<rect x="372" y="73" width="7" height="7" fill="#22d3ee"/><text x="394" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">Built Akshara-Deepa, a full-stack Android SSLC learning app</text><text x="394" y="103" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd5e1">with Capacitor.js, Firebase and Google Sign-In.</text><rect x="372" y="127" width="7" height="7" fill="#22d3ee"/><text x="394" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">Integrated Gemini 1.5 Flash for adaptive quizzes, automated</text><text x="394" y="157" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd5e1">answer evaluation, a study planner and an AI tutor.</text><rect x="372" y="181" width="7" height="7" fill="#22d3ee"/><text x="394" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">Designed Strength Map radar charts for mastery, accuracy and</text><text x="394" y="211" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd5e1">streaks, with real-time Firestore sync.</text><rect x="372" y="235" width="7" height="7" fill="#22d3ee"/><text x="394" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">Owned UI/UX, testing and Gradle release builds: a 100% crash-</text><text x="394" y="265" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#cbd5e1">free launch on the Google Play internal test track.</text>
