<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">EV Charging Analytics</title>
  <desc id="desc">A forecasting and clustering platform for electric vehicle charging stations.</desc>
  <rect x="2" y="2" width="996" height="516" rx="24" fill="#f3fbfc" stroke="#8dd3df" stroke-width="3" />
  <rect x="2" y="2" width="12" height="516" rx="6" fill="#0e8795" />
  <text x="42" y="58" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">06  /  FORECASTING</text>
  <text x="42" y="112" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">EV Charging Analytics</text>
  <text x="42" y="153" fill="#36566b" font-family="Arial, Helvetica, sans-serif" font-size="22">Demand forecasting and station segmentation for EV charging analytics.</text>
  <circle cx="48" cy="215" r="5" fill="#0e8795" /><text x="68" y="223" fill="#183b50" font-family="Arial, Helvetica, sans-serif" font-size="21">Forecasts and clusters data across 457 charging stations.</text>
  <circle cx="48" cy="270" r="5" fill="#0e8795" /><text x="68" y="278" fill="#183b50" font-family="Arial, Helvetica, sans-serif" font-size="21">Uses Prophet, Histogram Gradient Boosting, and Random Forest for demand.</text>
  <circle cx="48" cy="325" r="5" fill="#0e8795" /><text x="68" y="333" fill="#183b50" font-family="Arial, Helvetica, sans-serif" font-size="21">K-Means and PCA identify 4 station personas, shown in Plotly dashboards.</text>
  <line x1="42" y1="378" x2="958" y2="378" stroke="#d5e9ed" stroke-width="2" />
  <text x="42" y="420" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">STACK</text>
  <text x="42" y="456" fill="#36566b" font-family="Arial, Helvetica, sans-serif" font-size="18">Python · Streamlit · Prophet · Scikit-learn · K-Means · PCA · Plotly</text>
  <text x="42" y="490" fill="#607d8b" font-family="Arial, Helvetica, sans-serif" font-size="16">Histogram Gradient Boosting · Random Forest</text>
