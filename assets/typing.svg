<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-labelledby="title desc">
  <title id="title">Areas of focus</title>
  <desc id="desc">A slow rotating text line: Generative AI and RAG; multi-agent systems; forecasting; computer vision.</desc>
  <rect x="1" y="1" width="998" height="74" rx="14" fill="#effbfc" stroke="#d4edf0" />
  <circle cx="28" cy="38" r="5" fill="#0e8795" />
  <defs>
    <clipPath id="reveal"><rect x="48" y="0" width="800" height="76"><animate attributeName="width" values="0;800;800;0" keyTimes="0;0.28;0.8;1" dur="4s" repeatCount="indefinite" /></rect></clipPath>
  </defs>
  <g fill="#245267" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" clip-path="url(#reveal)">
    <text x="48" y="46" opacity="1">Generative AI · Retrieval-Augmented Generation<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.24;0.94;1" dur="16s" repeatCount="indefinite" /></text>
    <text x="48" y="46" opacity="0">Multi-agent systems · Grounding and evaluation<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.25;0.43;0.49;1" dur="16s" repeatCount="indefinite" /></text>
    <text x="48" y="46" opacity="0">Time-series forecasting · Predictive analytics<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.50;0.68;0.74;1" dur="16s" repeatCount="indefinite" /></text>
    <text x="48" y="46" opacity="0">Computer vision · Edge audio classification<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.75;0.93;0.99;1" dur="16s" repeatCount="indefinite" /></text>
  </g>
</svg>
