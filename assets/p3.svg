<rect x="6" y="6" width="478" height="250" rx="16" fill="none" stroke="url(#bd)" stroke-opacity=".6" stroke-width="1.5"/>
<rect x="6" y="6" width="478" height="250" rx="16" fill="none" stroke="#ffffff" stroke-width="2.5" pathLength="1000" stroke-dasharray="80 920" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="1000;0" dur="6s" repeatCount="indefinite"/></rect>
<text x="28" y="40" font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" fill="#7c3aed" font-weight="700" style="fill:#a78bfa">03 / PROJECT</text>
<circle cx="460" cy="36" r="4" fill="#34d399"><animate attributeName="r" values="3;5.5;3" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="28" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="url(#tt)">LaunchPad AI</text>
<text x="28" y="96" font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="11.5" fill="#22d3ee" letter-spacing="1">MULTI-AGENT  ·  CRITIC LOOP  ·  FORECASTING</text>
<text x="28" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Multi-agent system for startup research, architecture</text><text x="28" y="149" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">and revenue forecasts. A self-correcting Critic Agent</text><text x="28" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">scores outputs 0.0-1.0 and routes retries; RAG-grounded,</text><text x="28" y="191" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">with real-time results over WebSockets.</text><rect x="28" y="218" width="82" height="24" rx="12" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="69" y="234" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="11.5" fill="#22d3ee">LangGraph</text><rect x="118" y="218" width="75" height="24" rx="12" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="156" y="234" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="11.5" fill="#22d3ee">ChromaDB</text><rect x="201" y="218" width="54" height="24" rx="12" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="229" y="234" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="11.5" fill="#22d3ee">GPT-4</text><rect x="264" y="218" width="68" height="24" rx="12" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="298" y="234" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="11.5" fill="#22d3ee">Prophet</text>
