<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="42" viewBox="0 0 1000 42" role="img" aria-labelledby="title desc">
  <title id="title">Areas of focus</title>
  <desc id="desc">Generative AI and RAG; multi-agent systems; forecasting; computer vision.</desc>
  <circle cx="8" cy="20" r="4" fill="#0e7490" />
  <text x="24" y="28" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" opacity="1">
    Generative AI · Retrieval-Augmented Generation
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.16;0.20;0.97;1" dur="24s" repeatCount="indefinite" />
  </text>
  <text x="24" y="28" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" opacity="0">
    Multi-agent systems · Grounding and evaluation
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.25;0.42;0.46;1" dur="24s" repeatCount="indefinite" />
  </text>
  <text x="24" y="28" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" opacity="0">
    Time-series forecasting · Predictive analytics
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.50;0.67;0.71;1" dur="24s" repeatCount="indefinite" />
  </text>
  <text x="24" y="28" fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" opacity="0">
    Computer vision · Edge audio classification
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.73;0.75;0.92;0.96;1" dur="24s" repeatCount="indefinite" />
  </text>
</svg>
