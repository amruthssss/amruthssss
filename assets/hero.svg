<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Amruth S Sharma</title>
  <desc id="desc">AI/ML Engineer focused on Generative AI, RAG, and multi-agent systems.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1fbfd" />
      <stop offset="1" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087f8c" />
      <stop offset="1" stop-color="#0891b2">
        <animate attributeName="stop-color" values="#0891b2;#22a6bd;#0891b2" dur="18s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="188" rx="22" fill="url(#wash)" stroke="#ccecf1" stroke-width="2" />
  <rect x="1" y="1" width="8" height="188" rx="4" fill="url(#accent)" />
  <text x="42" y="87" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Amruth S Sharma</text>
  <text x="44" y="132" fill="#36566b" font-family="Arial, Helvetica, sans-serif" font-size="24">AI/ML Engineer · Generative AI · RAG · Multi-Agent Systems</text>
  <text x="958" y="68" text-anchor="end" fill="#087f8c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">BENGALURU · INDIA</text>
